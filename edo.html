<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecuaciones diferenciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

<style>
/* ============================================================
   TOKENS — light is the base; dark redefines only the values
   ============================================================ */
:root{
  color-scheme: light;
  --ground:      #E7EBE6;
  --ground-line: #DADFD9;
  --panel:       #FAFBF9;
  --panel-alt:   #F0F3EF;
  --panel-sunk:  #E9EDE8;

  --ink:    #131917;
  --ink-2:  #4C5754;
  --ink-3:  #7B8683;
  --ink-4:  #9BA5A1;

  --rule:        #D3D9D3;
  --rule-strong: #B7C0B8;

  --accent:      #2E6FC4;
  --accent-ink:  #24589E;
  --accent-wash: rgba(46,111,196,.10);
  --accent-edge: rgba(46,111,196,.30);

  --verde:      #0E8C7E;
  --verde-wash: rgba(14,140,126,.12);

  --ok:     #0F7A46;
  --warn:   #9C6A15;
  --stop:   #B23A3A;

  --shadow: 0 1px 2px rgba(19,25,23,.05), 0 8px 24px -16px rgba(19,25,23,.18);

  --sans:  "Archivo", "Segoe UI", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono:  "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:      #0E1416;
    --ground-line: #161E20;
    --panel:       #171F21;
    --panel-alt:   #1D2729;
    --panel-sunk:  #121A1C;

    --ink:    #E8EDEA;
    --ink-2:  #9FADA9;
    --ink-3:  #74827E;
    --ink-4:  #5C6A66;

    --rule:        #253032;
    --rule-strong: #354245;

    --accent:      #5C97E8;
    --accent-ink:  #7EAEEF;
    --accent-wash: rgba(92,151,232,.14);
    --accent-edge: rgba(92,151,232,.36);

    --verde:      #24A896;
    --verde-wash: rgba(36,168,150,.14);

    --ok:     #3FB273;
    --warn:   #D2A03E;
    --stop:   #E06B6B;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:      #0E1416;
  --ground-line: #161E20;
  --panel:       #171F21;
  --panel-alt:   #1D2729;
  --panel-sunk:  #121A1C;

  --ink:    #E8EDEA;
  --ink-2:  #9FADA9;
  --ink-3:  #74827E;
  --ink-4:  #5C6A66;

  --rule:        #253032;
  --rule-strong: #354245;

  --accent:      #5C97E8;
  --accent-ink:  #7EAEEF;
  --accent-wash: rgba(92,151,232,.14);
  --accent-edge: rgba(92,151,232,.36);

  --verde:      #24A896;
  --verde-wash: rgba(36,168,150,.14);

  --ok:     #3FB273;
  --warn:   #D2A03E;
  --stop:   #E06B6B;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
body{
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
.m{ font-family: var(--mono); font-size: .94em; color: var(--ink); }

/* ============================================================
   SHELL — rail lateral + escenario
   ============================================================ */
.shell{ display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.view, .view > *{ min-width: 0; }

.rail{
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  background: var(--panel-sunk); border-right: 1px solid var(--rule);
  padding: 24px 0 28px; display: flex; flex-direction: column; gap: 24px;
}
.brand{ padding: 0 20px; }
.brand h1{ margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.brand-mark{ display: inline-block; width: 18px; border-top: 2px solid var(--accent); margin-bottom: 9px; }
.brand-sub{
  margin-top: 4px; font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}
.navgroup{ display: flex; flex-direction: column; gap: 2px; }
.navgroup > h2{
  margin: 0 0 6px; padding: 0 20px; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-4);
}
.navlink{
  display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 9px;
  width: 100%; padding: 8px 20px 8px 16px; border: 0; border-left: 3px solid transparent;
  background: transparent; color: var(--ink-3); font-family: var(--sans); font-size: 13px; font-weight: 500;
  text-align: left; cursor: pointer; transition: color .14s, background-color .14s, border-color .14s;
}
.navlink .glyph{ font-family: var(--mono); font-size: 11px; text-align: center; color: var(--ink-4); transition: color .14s; }
.navlink:hover{ color: var(--ink); background: var(--panel-alt); }
.navlink:hover .glyph{ color: var(--ink-2); }
.navlink[aria-current="page"]{ color: var(--ink); font-weight: 600; background: var(--panel); border-left-color: var(--accent); }
.navlink[aria-current="page"] .glyph{ color: var(--accent); }
.railfoot{ margin-top: auto; padding: 0 20px; font-family: var(--mono); font-size: 9.5px; line-height: 1.7; color: var(--ink-4); }

.stage{ min-width: 0; max-width: 980px; padding: 36px 28px 96px; }
.view{ display: none; }
.view.is-active{ display: block; }

@media (max-width: 820px){
  .shell{ grid-template-columns: minmax(0,1fr); }
  .rail{ position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
  .stage{ padding: 26px 18px 72px; }
}

.eyebrow{
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .17em; text-transform: uppercase; color: var(--ink-3);
  margin: 0 0 10px;
}
.view > header h2{
  margin: 0; font-size: clamp(26px, 3.4vw, 36px); font-weight: 700;
  letter-spacing: -.03em; line-height: 1.08; text-wrap: balance;
}
.lede{
  font-family: var(--serif); font-size: 17px; line-height: 1.6;
  color: var(--ink-2); max-width: 66ch; margin: 14px 0 32px;
}
.prose{ font-family: var(--serif); font-size: 15.5px; line-height: 1.65; color: var(--ink-2); max-width: 68ch; }
h3.sec{ margin: 0 0 4px; font-size: 15px; font-weight: 600; }
h4.sec{ margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
.sec-note{ margin: 0; font-size: 13px; color: var(--ink-3); max-width: 68ch; }
.tcap{ margin: 10px 2px 0; font-size: 12px; line-height: 1.55; color: var(--ink-3); max-width: 78ch; }

/* ============================================================
   PANELS
   ============================================================ */
.panel{ background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; box-shadow: var(--shadow); }
.panel + .panel{ margin-top: 22px; }
.panel-head{
  padding: 16px 20px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.panel-body{ padding: 20px; }

.formula{
  background: var(--panel-sunk); border: 1px solid var(--rule); border-radius: 3px;
  padding: 14px 16px; font-family: var(--mono); font-size: 13.5px; line-height: 1.9; overflow-x: auto;
}
.note{
  margin-top: 16px; padding: 12px 15px; border: 1px solid var(--rule);
  border-left: 3px solid var(--n-color, var(--rule-strong)); border-radius: 3px;
  background: var(--panel-alt); font-size: 13px; line-height: 1.6; color: var(--ink-2);
}
.note b{ display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: var(--n-color, var(--ink-3)); margin-bottom: 4px; }
.note.ok{ --n-color: var(--verde); }
.note.warn{ --n-color: var(--warn); }

.answer{
  margin-top: 16px; border: 1px solid var(--accent-edge); border-radius: 3px; background: var(--accent-wash);
  display: grid; grid-template-columns: minmax(180px, auto) 1fr;
}
@media (max-width: 640px){ .answer{ grid-template-columns: minmax(0,1fr); } }
.answer-main{ padding: 16px 18px; border-right: 1px solid var(--accent-edge); }
@media (max-width: 640px){ .answer-main{ border-right: 0; border-bottom: 1px solid var(--accent-edge); } }
.answer-lbl{ font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent-ink); margin-bottom: 5px; }
.answer-val{ font-family: var(--mono); font-weight: 600; letter-spacing: -.01em; color: var(--ink); line-height: 1.3; }
.answer-facts{ padding: 14px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr));
  gap: 10px 16px; align-content: center; }
.answer-facts dt{ font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 2px; }
.answer-facts dd{ margin: 0; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ============================================================
   TABLES
   ============================================================ */
.tablewrap{ overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 3px; background: var(--panel); }
table.data{ width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data thead th{ position: sticky; top: 0; background: var(--panel-alt); color: var(--ink-2);
  font-weight: 600; font-size: 11px; letter-spacing: .04em; text-align: right; padding: 9px 14px;
  border-bottom: 1px solid var(--rule-strong); }
table.data thead th.l, table.data tbody td.l{ text-align: left; white-space: normal; }
table.data tbody td{ padding: 8px 14px; text-align: right; border-bottom: 1px solid var(--rule); color: var(--ink); }
table.data tbody tr:last-child td{ border-bottom: 0; }
table.data tbody tr:hover td{ background: var(--panel-alt); }
table.data tbody tr.hit td{ background: var(--accent-wash); font-weight: 500; }
table.data tbody tr.hit td:first-child{ box-shadow: inset 3px 0 0 var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ============================================================
   STEPPER
   ============================================================ */
.stepper{ list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
.step{ display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 18px; align-items: start; position: relative; }
.step:not(:last-child)::before{ content: ""; position: absolute; left: 19px; top: 44px; bottom: -22px;
  width: 1px; background: var(--rule-strong); }
.step-mark{ width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--accent-edge); background: var(--panel); color: var(--accent-ink);
  font-family: var(--mono); font-size: 15px; font-weight: 600; position: relative; z-index: 1; }
.step.done .step-mark{ background: var(--accent); border-color: var(--accent); color: #fff; }
.step > .panel{ margin-top: 0; }
.step-next{ display: flex; justify-content: flex-end; margin-top: 16px; }
@media (max-width: 560px){
  .step{ grid-template-columns: 30px minmax(0,1fr); gap: 12px; }
  .step-mark{ width: 30px; height: 30px; font-size: 12px; }
  .step:not(:last-child)::before{ left: 14px; top: 34px; }
}

/* ============================================================
   MATRICES
   ============================================================ */
.matbuild{ overflow-x: auto; max-width: 100%; padding-bottom: 4px; }
table.matgrid{ border-collapse: separate; border-spacing: 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.matgrid input{
  width: 62px; padding: 7px 4px; text-align: center; border: 1px solid var(--rule-strong);
  border-radius: 3px; background: var(--panel-sunk); color: var(--ink); font-family: var(--mono); font-size: 13px;
}
table.matgrid input:focus{ border-color: var(--accent); outline: none; }
table.matgrid td.bcell input{ background: var(--accent-wash); border-color: var(--accent-edge); }
table.matgrid td.bcell{ border-left: 2px solid var(--rule-strong); padding-left: 10px; }
table.matgrid th{ font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--ink-4); padding-bottom: 2px; }
table.matgrid th.bhead{ padding-left: 14px; }
.mrowlbl{ font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-right: 6px; white-space: nowrap; }

.matdisp-wrap{ overflow-x: auto; max-width: 100%; }
.matdisp{ display: inline-grid; gap: 2px; padding: 10px; background: var(--panel-sunk);
  border: 1px solid var(--rule); border-radius: 3px; }
.matdisp .mcell{ min-width: 54px; padding: 5px 8px; text-align: right; font-family: var(--mono);
  font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); background: var(--panel); border-radius: 2px; }
.matdisp .mcell.diag{ background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }
.matdisp .mcell.zero{ color: var(--ink-4); }
.matpair{ display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.matpair > div{ display: flex; flex-direction: column; gap: 8px; }
.matpair .mlbl{ font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-4); }

.reuse-panel{ border: 1px solid var(--accent-edge); border-left: 3px solid var(--accent); border-radius: 3px;
  background: var(--accent-wash); padding: 18px 20px; margin-top: 22px; }
.reuse-panel h4{ margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--ink); }
.reuse-panel .sub{ margin: 0 0 14px; font-size: 13.5px; color: var(--ink-2); }
.bvec-row{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bvec-row input{ width: 74px; padding: 8px 6px; text-align: center; font-family: var(--mono); font-size: 13px;
  border: 1px solid var(--rule-strong); border-radius: 3px; background: var(--panel); color: var(--ink); }
.bvec-row input:focus{ border-color: var(--accent); outline: none; }
.locked-badge{ display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px;
  font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--verde); background: var(--verde-wash);
  border: 1px solid var(--verde); border-radius: 3px; padding: 3px 9px; margin-bottom: 12px; }

/* ============================================================
   CONTROLS / BUTTONS
   ============================================================ */
.controls{ display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 14px 16px; align-items: end; }
.field{ display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label{ font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .03em; color: var(--ink-3); }
.field input, .field select{ font-family: var(--mono); font-size: 13px; padding: 8px 10px; border: 1px solid var(--rule-strong);
  border-radius: 3px; background: var(--panel-sunk); color: var(--ink); min-width: 0; width: 100%; }
.field input:focus, .field select:focus{ border-color: var(--accent); }

.btn{ font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px 20px; border: 1px solid var(--accent);
  border-radius: 3px; background: var(--accent); color: #fff; cursor: pointer; transition: filter .14s; white-space: nowrap; }
.btn:hover{ filter: brightness(1.08); }
.btn.ghost{ background: transparent; color: var(--ink-2); border-color: var(--rule-strong); font-weight: 500; }
.btn.ghost:hover{ color: var(--ink); border-color: var(--ink-3); filter: none; }
.btn.sm{ font-size: 11.5px; padding: 6px 13px; }
.rowend{ display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.errbox{ margin-top: 14px; padding: 11px 14px; border: 1px solid var(--stop); border-radius: 3px;
  background: var(--panel-alt); font-family: var(--mono); font-size: 12.5px; color: var(--stop); }
.errbox:empty{ display: none; }

/* ============================================================
   CODE
   ============================================================ */
details.code{ margin-top: 22px; border: 1px solid var(--rule); border-radius: 3px; background: var(--panel-sunk); }
details.code > summary{ cursor: pointer; padding: 11px 16px; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); list-style: none; display: flex; align-items: center; gap: 9px; }
details.code > summary::-webkit-details-marker{ display: none; }
details.code > summary::before{ content: "+"; font-size: 13px; color: var(--accent); width: 10px; }
details.code[open] > summary::before{ content: "\2212"; }
details.code[open] > summary{ border-bottom: 1px solid var(--rule); }
details.code > summary:hover{ color: var(--ink); }
pre.py{ margin: 0; padding: 16px 18px; overflow-x: auto; font-family: var(--mono); font-size: 12px;
  line-height: 1.65; color: var(--ink-2); tab-size: 4; }
pre.py .kw{ color: var(--accent-ink); }
pre.py .fn{ color: #7A5BC4; }
pre.py .st{ color: var(--verde); }
pre.py .cm{ color: var(--ink-4); font-style: italic; }
pre.py .nu{ color: #B0840F; }

.foot{ margin-top: 40px; font-family: var(--mono); font-size: 11px; color: var(--ink-4); line-height: 1.7; }

/* ============================================================
   INTERPOLACIÓN — pasos de sustitución y gráfica
   ============================================================ */
.steplist{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steplist li{ padding: 10px 13px; border: 1px solid var(--rule); border-radius: 3px; background: var(--panel-sunk);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--ink-2); overflow-x: auto; }
.steplist li b{ color: var(--ink); }
table.tdd tbody td{ padding: 4px 16px; }
table.tdd tbody tr:hover td{ background: transparent; }
.circ{ display: inline-block; padding: 1px 9px; border: 2px solid var(--stop); border-radius: 999px; }
.boxg{ display: inline-block; padding: 1px 8px; border: 2px solid var(--verde); border-radius: 4px; }
.plotwrap{ overflow-x: auto; max-width: 100%; display: flex; justify-content: center; padding: 6px 0; }
.plotlegend{ display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
.plotlegend span{ display: inline-flex; align-items: center; gap: 6px; }
.plotlegend i{ width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail" aria-label="Secciones">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Ecuaciones diferenciales</h1>
      <div class="brand-sub">Métodos Numéricos</div>
    </div>

    <div class="navgroup">
      <h2>Métodos de un paso (PVI)</h2>
      <button class="navlink" data-view="euler" aria-current="page"><span class="glyph" aria-hidden="true">①</span>Euler</button>
      <button class="navlink" data-view="heun"><span class="glyph" aria-hidden="true">②</span>Euler mejorado (Heun)</button>
      <button class="navlink" data-view="rk3"><span class="glyph" aria-hidden="true">③</span>Runge-Kutta de 3.er orden</button>
    </div>

    <div class="navgroup">
      <h2>Comparación</h2>
      <button class="navlink" data-view="cmp"><span class="glyph" aria-hidden="true">④</span>Comparar métodos y errores</button>
    </div>

    <div class="navgroup">
      <h2>Vista</h2>
      <button class="navlink" id="themeBtn" type="button"><span class="glyph" aria-hidden="true">◐</span><span id="themeLbl">Claro / oscuro</span></button>
    </div>

    <div class="railfoot">UPeU · Ing. de Sistemas<br>Sesión 14 · EDO<br>Tablas recalculadas en vivo</div>
  </nav>

  <main class="stage">
    <section class="view is-active" id="view-euler"></section>
    <section class="view" id="view-heun"></section>
    <section class="view" id="view-rk3"></section>
    <section class="view" id="view-cmp"></section>
  </main>
</div>

<script>
"use strict";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function trimNum(v, d){
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s === "-0" ? "0" : s;
}

/* ---- resaltado de Python (igual al resto del sitio) ---- */
const PY_KW = new Set(["import","def","return","if","elif","else","for","in","range","raise","lambda","None","True","False","not","and","or","while","break","continue","as","from","print","reversed"]);
function hl(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|f?"(?:[^"\\\n]|\\.)*"|f?'(?:[^'\\\n]|\\.)*')|(\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="st">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="nu">' + esc(m[3]) + "</span>";
    else {
      const w = m[4];
      if (PY_KW.has(w)) out += '<span class="kw">' + esc(w) + "</span>";
      else if (src[re.lastIndex] === "(") out += '<span class="fn">' + esc(w) + "</span>";
      else out += esc(w);
    }
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

function parseExpr(src){
  let s = String(src).toLowerCase().replace(/\s+/g, "").replace(/,/g, ".").replace(/²/g, "^2").replace(/³/g, "^3").replace(/π/g, "pi").replace(/sen\(/g, "sin(");
  if (!s) throw new Error("Escribe la función f(x)");
  const toks = [];
  const re = /(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|([a-z]+)|([-+*/^()])/g;
  let m, last = 0;
  while ((m = re.exec(s)) !== null){
    if (m.index !== last) throw new Error("Carácter no válido en f(x): «" + s.slice(last, m.index) + "»");
    last = re.lastIndex;
    if (m[1] !== undefined) toks.push({ t: "num", v: Number(m[1]) });
    else if (m[2] !== undefined) toks.push({ t: "id", v: m[2] });
    else toks.push({ t: "op", v: m[3] });
  }
  if (last !== s.length) throw new Error("Carácter no válido en f(x): «" + s.slice(last) + "»");
  const FUNCS = ["sin", "cos", "tan", "exp", "ln", "log", "sqrt"];
  let pos = 0;
  const peek = () => toks[pos];
  const isOp = v => toks[pos] && toks[pos].t === "op" && toks[pos].v === v;
  function parseExprR(){
    let a = parseTerm();
    while (isOp("+") || isOp("-")){ const op = toks[pos++].v; a = { t: "bin", op, a, b: parseTerm() }; }
    return a;
  }
  function startsPrimary(){
    const k = peek();
    return k && (k.t === "id" || (k.t === "op" && k.v === "("));
  }
  function parseTerm(){
    let a = parseUnary();
    for (;;){
      if (isOp("*") || isOp("/")){ const op = toks[pos++].v; a = { t: "bin", op, a, b: parseUnary() }; }
      else if (startsPrimary()) a = { t: "bin", op: "*", a, b: parseUnary() };
      else break;
    }
    return a;
  }
  function parseUnary(){
    if (isOp("-")){ pos++; return { t: "neg", a: parseUnary() }; }
    if (isOp("+")){ pos++; return parseUnary(); }
    return parsePower();
  }
  function parsePower(){
    const base = parsePrimary();
    if (isOp("^")){ pos++; return { t: "bin", op: "^", a: base, b: parseUnary() }; }
    return base;
  }
  function parsePrimary(){
    const k = toks[pos++];
    if (!k) throw new Error("La expresión f(x) está incompleta");
    if (k.t === "num") return { t: "num", v: k.v };
    if (k.t === "id"){
      if (k.v === "x" || k.v === "t") return { t: "x" }; if (k.v === "y") return { t: "y" };
      if (k.v === "pi") return { t: "num", v: Math.PI };
      if (k.v === "e") return { t: "num", v: Math.E };
      if (FUNCS.indexOf(k.v) >= 0){
        if (!isOp("(")) throw new Error("Escribe " + k.v + " con paréntesis: " + k.v + "(…)");
        pos++;
        const arg = parseExprR();
        if (!isOp(")")) throw new Error("Falta cerrar un paréntesis");
        pos++;
        return { t: "fn", name: k.v, a: arg };
      }
      throw new Error("«" + k.v + "» no es una función ni constante conocida");
    }
    if (k.t === "op" && k.v === "("){
      const a = parseExprR();
      if (!isOp(")")) throw new Error("Falta cerrar un paréntesis");
      pos++;
      return a;
    }
    throw new Error("Símbolo inesperado «" + k.v + "» en f(x)");
  }
  const ast = parseExprR();
  if (pos < toks.length) throw new Error("Sobra «" + toks[pos].v + "» en f(x)");
  return ast;
}
function hasX(ast){
  if (ast.t === "x") return true;
  if (ast.t === "num") return false;
  if (ast.t === "neg" || ast.t === "fn") return hasX(ast.a);
  return hasX(ast.a) || hasX(ast.b);
}
/* series de Taylor truncadas a orden m: s[k] = f^(k)(t) / k! */
const SR = {
  cst(c, m){ const s = new Array(m + 1).fill(0); s[0] = c; return s; },
  add(a, b){ return a.map((v, i) => v + b[i]); },
  sub(a, b){ return a.map((v, i) => v - b[i]); },
  neg(a){ return a.map(v => -v); },
  mul(a, b){
    const m = a.length - 1, c = new Array(m + 1).fill(0);
    for (let i = 0; i <= m; i++) for (let j = 0; j <= m - i; j++) c[i + j] += a[i] * b[j];
    return c;
  },
  div(a, b){
    const m = a.length - 1, c = new Array(m + 1).fill(0);
    for (let k = 0; k <= m; k++){
      let s = a[k];
      for (let j = 1; j <= k; j++) s -= b[j] * c[k - j];
      c[k] = s / b[0];
    }
    return c;
  },
  exp(a){
    const m = a.length - 1, c = new Array(m + 1).fill(0);
    c[0] = Math.exp(a[0]);
    for (let k = 1; k <= m; k++){
      let s = 0;
      for (let j = 1; j <= k; j++) s += j * a[j] * c[k - j];
      c[k] = s / k;
    }
    return c;
  },
  ln(a){
    const m = a.length - 1, c = new Array(m + 1).fill(0);
    c[0] = Math.log(a[0]);
    for (let k = 1; k <= m; k++){
      let s = 0;
      for (let j = 1; j <= k - 1; j++) s += j * c[j] * a[k - j];
      c[k] = (a[k] - s / k) / a[0];
    }
    return c;
  },
  sincos(a){
    const m = a.length - 1, s = new Array(m + 1).fill(0), c = new Array(m + 1).fill(0);
    s[0] = Math.sin(a[0]); c[0] = Math.cos(a[0]);
    for (let k = 1; k <= m; k++){
      let ss = 0, cc = 0;
      for (let j = 1; j <= k; j++){ ss += j * a[j] * c[k - j]; cc += j * a[j] * s[k - j]; }
      s[k] = ss / k; c[k] = -cc / k;
    }
    return { s, c };
  },
  pow(a, p){
    const m = a.length - 1;
    if (a[0] === 0){
      if (Number.isInteger(p) && p >= 0){
        let r = SR.cst(1, m);
        for (let i = 0; i < p; i++) r = SR.mul(r, a);
        return r;
      }
      return new Array(m + 1).fill(NaN);
    }
    const c = new Array(m + 1).fill(0);
    c[0] = Math.pow(a[0], p);
    for (let k = 1; k <= m; k++){
      let s = 0;
      for (let j = 1; j <= k; j++) s += (p * j - (k - j)) * a[j] * c[k - j];
      c[k] = s / (k * a[0]);
    }
    return c;
  }
};
function evalS(ast, t, m){
  switch (ast.t){
    case "num": return SR.cst(ast.v, m);
    case "x": { const s = SR.cst(t, m); if (m >= 1) s[1] = 1; return s; }
    case "neg": return SR.neg(evalS(ast.a, t, m));
    case "bin": {
      if (ast.op === "^"){
        const A = evalS(ast.a, t, m);
        if (!hasX(ast.b)) return SR.pow(A, evalS(ast.b, t, 0)[0]);
        return SR.exp(SR.mul(evalS(ast.b, t, m), SR.ln(A)));
      }
      const A = evalS(ast.a, t, m), B = evalS(ast.b, t, m);
      if (ast.op === "+") return SR.add(A, B);
      if (ast.op === "-") return SR.sub(A, B);
      if (ast.op === "*") return SR.mul(A, B);
      return SR.div(A, B);
    }
    case "fn": {
      const A = evalS(ast.a, t, m);
      if (ast.name === "exp") return SR.exp(A);
      if (ast.name === "ln") return SR.ln(A);
      if (ast.name === "log"){ const L = SR.ln(A), k = 1 / Math.LN10; return L.map(v => v * k); }
      if (ast.name === "sqrt") return SR.pow(A, 0.5);
      const sc = SR.sincos(A);
      if (ast.name === "sin") return sc.s;
      if (ast.name === "cos") return sc.c;
      return SR.div(sc.s, sc.c);
    }
  }
  return SR.cst(NaN, m);
}
const factN = k => { let f = 1; for (let i = 2; i <= k; i++) f *= i; return f; };

/* ============================================================
   COMPILADOR NUMÉRICO de f(x, y)
   ============================================================ */
function compileXY(ast){
  switch (ast.t){
    case "num": { const v = ast.v; return () => v; }
    case "x": return (x, y) => x;
    case "y": return (x, y) => y;
    case "neg": { const a = compileXY(ast.a); return (x, y) => -a(x, y); }
    case "bin": {
      const a = compileXY(ast.a), b = compileXY(ast.b);
      if (ast.op === "+") return (x, y) => a(x, y) + b(x, y);
      if (ast.op === "-") return (x, y) => a(x, y) - b(x, y);
      if (ast.op === "*") return (x, y) => a(x, y) * b(x, y);
      if (ast.op === "/") return (x, y) => a(x, y) / b(x, y);
      return (x, y) => Math.pow(a(x, y), b(x, y));
    }
    case "fn": {
      const a = compileXY(ast.a);
      switch (ast.name){
        case "sin": return (x, y) => Math.sin(a(x, y));
        case "cos": return (x, y) => Math.cos(a(x, y));
        case "tan": return (x, y) => Math.tan(a(x, y));
        case "exp": return (x, y) => Math.exp(a(x, y));
        case "ln": return (x, y) => Math.log(a(x, y));
        case "log": return (x, y) => Math.log10(a(x, y));
        default: return (x, y) => Math.sqrt(a(x, y));
      }
    }
  }
  return () => NaN;
}
function evalConst(src, msg){
  const s = String(src).trim();
  if (!s) throw new Error(msg);
  const v = compileXY(parseExpr(s))(0, 0);
  if (!isFinite(v)) throw new Error(msg);
  return v;
}

const METHODS = {
  euler: { name: "Euler", order: 1, step(f, x, y, h){ const k1 = f(x, y); return { y: y + h * k1, k1 }; } },
  heun: { name: "Euler mejorado (Heun)", order: 2, step(f, x, y, h){
    const k1 = f(x, y), z = y + h * k1, k2 = f(x + h, z);
    return { y: y + h / 2 * (k1 + k2), k1, z, k2 };
  } },
  rk3: { name: "Runge-Kutta de 3.er orden", order: 3, step(f, x, y, h){
    const k1 = f(x, y), k2 = f(x + h / 2, y + h / 2 * k1), k3 = f(x + h, y - h * k1 + 2 * h * k2);
    return { y: y + h / 6 * (k1 + 4 * k2 + k3), k1, k2, k3 };
  } },
  rk4: { name: "Runge-Kutta de 4.º orden", order: 4, step(f, x, y, h){
    const k1 = f(x, y), k2 = f(x + h / 2, y + h / 2 * k1), k3 = f(x + h / 2, y + h / 2 * k2), k4 = f(x + h, y + h * k3);
    return { y: y + h / 6 * (k1 + 2 * k2 + 2 * k3 + k4), k1, k2, k3, k4 };
  } }
};
function integrate(m, f, x0, y0, h, n){
  const rows = [];
  let x = x0, y = y0;
  for (let j = 0; j < n; j++){
    const s = METHODS[m].step(f, x, y, h);
    rows.push(Object.assign({}, s, { j, x, y, xn: x0 + (j + 1) * h, yNext: s.y }));
    y = s.y; x = x0 + (j + 1) * h;
  }
  return { rows, x, y };
}

function plotODE(x0, xf, series){
  const W = 640, H = 340, ML = 56, MR = 18, MT = 18, MB = 34;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const all = [];
  series.forEach(s => s.pts.forEach(p => { if (isFinite(p[1])) all.push(p[1]); }));
  if (!all.length) return "";
  let ymin = Math.min.apply(null, all), ymax = Math.max.apply(null, all);
  if (ymin === ymax){ ymin -= 1; ymax += 1; }
  const pad = (ymax - ymin) * 0.1; ymin -= pad; ymax += pad;
  const sx = x => ML + (x - x0) / (xf - x0) * plotW;
  const sy = y => MT + (1 - (y - ymin) / (ymax - ymin)) * plotH;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:640px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">';
  for (let i = 0; i <= 4; i++){
    const yv = ymin + (ymax - ymin) * i / 4, yy = sy(yv);
    svg += '<line x1="' + ML + '" y1="' + yy.toFixed(2) + '" x2="' + (ML + plotW) + '" y2="' + yy.toFixed(2) + '" style="stroke:var(--rule);stroke-width:1;stroke-dasharray:2,3"/>';
    svg += '<text x="' + (ML - 8) + '" y="' + (yy + 3).toFixed(2) + '" font-size="10" text-anchor="end" style="fill:var(--ink-3)">' + trimNum(yv, 3) + '</text>';
  }
  svg += '<line x1="' + ML + '" y1="' + MT + '" x2="' + ML + '" y2="' + (MT + plotH) + '" style="stroke:var(--rule-strong);stroke-width:1"/>';
  svg += '<line x1="' + ML + '" y1="' + (MT + plotH) + '" x2="' + (ML + plotW) + '" y2="' + (MT + plotH) + '" style="stroke:var(--rule-strong);stroke-width:1"/>';
  series.forEach(s => {
    let path = "";
    s.pts.forEach(p => { if (isFinite(p[1])) path += (path ? "L" : "M") + sx(p[0]).toFixed(2) + "," + sy(p[1]).toFixed(2) + " "; });
    svg += '<path d="' + path + '" fill="none" style="stroke:' + s.color + ';stroke-width:' + (s.w || 2) + (s.dash ? ';stroke-dasharray:' + s.dash : "") + '"/>';
    if (s.dots && s.pts.length <= 60) s.pts.forEach(p => {
      if (isFinite(p[1])) svg += '<circle cx="' + sx(p[0]).toFixed(2) + '" cy="' + sy(p[1]).toFixed(2) + '" r="3.6" style="fill:' + s.color + ';stroke:var(--panel);stroke-width:1.2"/>';
    });
  });
  const ticks = 5;
  for (let i = 0; i <= ticks; i++){
    const xv = x0 + (xf - x0) * i / ticks;
    svg += '<text x="' + sx(xv).toFixed(2) + '" y="' + (H - 10) + '" font-size="10" text-anchor="middle" style="fill:var(--ink-3)">' + trimNum(xv, 3) + '</text>';
  }
  return svg + "</svg>";
}
function plotPanel(titulo, svg, series){
  return '<div class="panel"><div class="panel-head"><h3 class="sec">' + titulo + '</h3></div><div class="panel-body">' +
    '<div class="plotwrap">' + svg + '</div>' +
    '<div class="plotlegend">' + series.map(s => '<span><i style="background:' + s.color + ';border-radius:2px;width:16px;height:3px"></i>' + s.name + '</span>').join("") + '</div></div></div>';
}

/* lectura común */
function common(p){
  let f, fTxt;
  if ($(p + "Form").value === "diff"){
    const M = compileXY(parseExpr($(p + "M").value)), N = compileXY(parseExpr($(p + "N").value));
    f = (x, y) => -M(x, y) / N(x, y);
    fTxt = "−M/N";
  } else { f = compileXY(parseExpr($(p + "Fn").value)); fTxt = "f"; }
  const x0 = evalConst($(p + "X0").value, "x₀ no es válido");
  const y0 = evalConst($(p + "Y0").value, "y₀ no es válido");
  const xf = evalConst($(p + "XF").value, "El x final no es válido");
  const h = evalConst($(p + "H").value, "El paso h no es válido");
  if (!(h > 0)) throw new Error("h debe ser positivo");
  if (!(xf > x0)) throw new Error("Debe cumplirse x final > x₀");
  const nr = (xf - x0) / h, n = Math.round(nr);
  if (Math.abs(nr - n) > 1e-9 * Math.max(1, nr)) throw new Error("(x final − x₀)/h = " + trimNum(nr, 6) + " no es entero: elige h tal que se llegue exactamente a x final");
  if (n > 20000) throw new Error("Demasiados pasos (máximo 20000)");
  const dec = Math.max(0, Math.min(12, Math.round(Number($(p + "Dec").value) || 6)));
  let ex = null, exactNote = "";
  if ($(p + "ExMode").value === "manual"){
    if (!$(p + "Exact").value.trim()) throw new Error("Escribe la solución exacta y(x) o elige la referencia numérica");
    const g = compileXY(parseExpr($(p + "Exact").value));
    ex = x => g(x, 0); exactNote = "la solución exacta dada";
  } else {
    // RK4 con 40 subpasos por cada intervalo de ancho h, encadenado desde x0
    const cache = [y0];
    ex = x => {
      const j = Math.round((x - x0) / h);
      while (cache.length <= j){
        let yy = cache[cache.length - 1], xx = x0 + (cache.length - 1) * h;
        const hs = h / 40;
        for (let s = 0; s < 40; s++){ yy = METHODS.rk4.step(f, xx, yy, hs).y; xx += hs; }
        cache.push(yy);
      }
      return cache[j];
    };
    exactNote = "la referencia numérica (RK4 con 40 subpasos por intervalo)";
  }
  return { f, x0, y0, xf, h, n, dec, ex, exactNote, fTxt, fmt: v => trimNum(v, dec) };
}
function pct(v){ return !isFinite(v) ? "—" : (v !== 0 && v < 1e-5 ? v.toExponential(2) : trimNum(v, 6)) + " %"; }
function showErr(p, e){ $(p + "Err").textContent = e.message; $(p + "Out").innerHTML = ""; }
function relErr(ex, v){ return isFinite(ex) && ex !== 0 ? Math.abs(ex - v) / Math.abs(ex) * 100 : NaN; }
function answerBox(label, valTxt, ex, v, extra){
  const has = ex !== null && isFinite(ex);
  return '<div class="answer" style="margin-top:16px"><div class="answer-main"><div class="answer-lbl">' + label + '</div><div class="answer-val" style="font-size:20px">' + valTxt + '</div></div>' +
    '<dl class="answer-facts">' + (has ? '<div><dt>Valor verdadero</dt><dd>' + trimNum(ex, 8) + '</dd></div><div><dt>Error absoluto</dt><dd>' + trimNum(Math.abs(ex - v), 8) + '</dd></div><div><dt>Error relativo</dt><dd>' + trimNum(relErr(ex, v), 4) + ' %</dd></div>' : "") + (extra || "") + '</dl></div>';
}

/* ============================================================
   TABLAS Y PASO A PASO de cada método
   ============================================================ */
function stepsTable(m, K, R){
  const fmt = K.fmt, rows = R.rows, n = rows.length;
  const showAll = n <= 40;
  const idx = showAll ? rows.map((_, i) => i) : [0, 1, 2, 3, -1, n - 3, n - 2, n - 1];
  let head;
  if (m === "euler") head = '<th class="l">j</th><th>x<sub>j</sub></th><th>y<sub>j</sub></th><th>f(x<sub>j</sub>, y<sub>j</sub>)</th><th>y<sub>j+1</sub></th>';
  else if (m === "heun") head = '<th class="l">j</th><th>x<sub>j</sub></th><th>y<sub>j</sub></th><th>f(x<sub>j</sub>, y<sub>j</sub>)</th><th>z<sub>j+1</sub></th><th>f(x<sub>j+1</sub>, z<sub>j+1</sub>)</th><th>y<sub>j+1</sub></th>';
  else head = '<th class="l">j</th><th>x<sub>j</sub></th><th>y<sub>j</sub></th><th>k₁</th><th>k₂</th><th>k₃</th><th>y<sub>j+1</sub></th>';
  head += '<th>y(x<sub>j+1</sub>) verdadero</th><th>Error rel. %</th>';
  const ncol = m === "euler" ? 7 : 9;
  let body = "";
  idx.forEach(i => {
    if (i === -1){ body += '<tr><td colspan="' + ncol + '" style="text-align:center;color:var(--ink-4)">⋮ (' + (n - 6) + ' pasos intermedios)</td></tr>'; return; }
    const r = rows[i], e = K.ex(r.xn);
    let cells = '<td class="l">' + r.j + '</td><td>' + fmt(r.x) + '</td><td>' + fmt(r.y) + '</td>';
    if (m === "euler") cells += '<td>' + fmt(r.k1) + '</td><td><b>' + fmt(r.yNext) + '</b></td>';
    else if (m === "heun") cells += '<td>' + fmt(r.k1) + '</td><td>' + fmt(r.z) + '</td><td>' + fmt(r.k2) + '</td><td><b>' + fmt(r.yNext) + '</b></td>';
    else cells += '<td>' + fmt(r.k1) + '</td><td>' + fmt(r.k2) + '</td><td>' + fmt(r.k3) + '</td><td><b>' + fmt(r.yNext) + '</b></td>';
    cells += '<td>' + fmt(e) + '</td><td>' + trimNum(relErr(e, r.yNext), 4) + '</td>';
    body += '<tr>' + cells + '</tr>';
  });
  return '<div class="tablewrap"><table class="data"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    (showAll ? "" : '<p class="tcap">Con más de 40 pasos se muestran solo los primeros y los últimos; el cálculo usa todos.</p>');
}
function stepLines(m, K, R){
  const fmt = K.fmt, h = K.h, th = parN(h, 8);
  const out = [];
  R.rows.slice(0, 12).forEach(r => {
    const j = r.j, y = r.y, yn = r.yNext;
    let li = '<li><b>Paso ' + (j + 1) + '</b> (x<sub>' + j + '</sub> = ' + fmt(r.x) + ', y<sub>' + j + '</sub> = ' + fmt(y) + ')<br>';
    if (m === "euler"){
      li += 'f(x<sub>' + j + '</sub>, y<sub>' + j + '</sub>) = ' + fmt(r.k1) + '<br>' +
        'y<sub>' + (j + 1) + '</sub> = ' + fmt(y) + ' + ' + th + '·' + parN(r.k1, K.dec) + ' = <b>' + fmt(yn) + '</b>';
    } else if (m === "heun"){
      li += 'f(x<sub>' + j + '</sub>, y<sub>' + j + '</sub>) = ' + fmt(r.k1) + '<br>' +
        'z<sub>' + (j + 1) + '</sub> = ' + fmt(y) + ' + ' + th + '·' + parN(r.k1, K.dec) + ' = ' + fmt(r.z) + '<br>' +
        'f(x<sub>' + (j + 1) + '</sub>, z<sub>' + (j + 1) + '</sub>) = f(' + fmt(r.xn) + ', ' + fmt(r.z) + ') = ' + fmt(r.k2) + '<br>' +
        'y<sub>' + (j + 1) + '</sub> = ' + fmt(y) + ' + (' + th + '/2)·[' + fmt(r.k1) + ' + ' + parN(r.k2, K.dec) + '] = <b>' + fmt(yn) + '</b>';
    } else {
      li += 'k₁ = f(' + fmt(r.x) + ', ' + fmt(y) + ') = ' + fmt(r.k1) + '<br>' +
        'k₂ = f(' + fmt(r.x + h / 2) + ', ' + fmt(y + h / 2 * r.k1) + ') = ' + fmt(r.k2) + '<br>' +
        'k₃ = f(' + fmt(r.xn) + ', ' + fmt(y - h * r.k1 + 2 * h * r.k2) + ') = ' + fmt(r.k3) + '<br>' +
        'y<sub>' + (j + 1) + '</sub> = ' + fmt(y) + ' + (' + th + '/6)·[' + fmt(r.k1) + ' + 4·' + parN(r.k2, K.dec) + ' + ' + parN(r.k3, K.dec) + '] = <b>' + fmt(yn) + '</b>';
    }
    out.push(li + '</li>');
  });
  return '<ul class="steplist">' + out.join("") + '</ul>' + (R.rows.length > 12 ? '<p class="tcap" style="margin-top:10px">Se detallan los primeros 12 pasos; la tabla siguiente tiene todos.</p>' : "");
}
function curvaExacta(K, N){
  const pts = [];
  for (let i = 0; i <= N; i++){ const x = K.x0 + (K.xf - K.x0) * i / N; pts.push([x, K.ex(x)]); }
  return pts;
}

/* ============================================================
   EJECUCIÓN de un método
   ============================================================ */
function runMethod(p){
  const m = VIEWS[p].m;
  $(p + "Err").textContent = "";
  try{
    const K = common(p), M = METHODS[m];
    const R = integrate(m, K.f, K.x0, K.y0, K.h, K.n);
    const yEnd = R.rows[R.rows.length - 1].yNext, exEnd = K.ex(K.xf);
    if (!isFinite(yEnd)) throw new Error("El método se salió del dominio de f (resultado no finito)");
    const pts = [[K.x0, K.y0]].concat(R.rows.map(r => [r.xn, r.yNext]));
    const series = [
      { name: "Solución verdadera y(x)", color: "var(--ink)", pts: curvaExacta(K, 120), w: 2 },
      { name: M.name, color: "var(--accent)", pts, w: 2, dots: true }
    ];
    $(p + "Out").innerHTML =
      '<div class="panel" style="margin-top:22px"><div class="panel-head"><h3 class="sec">Paso 3 — Datos del método</h3></div><div class="panel-body"><ul class="steplist">' +
        '<li>y′ = ' + K.fTxt + '(x, y), &nbsp; x₀ = ' + trimNum(K.x0, 6) + ', &nbsp; y₀ = ' + trimNum(K.y0, 6) + ', &nbsp; h = ' + trimNum(K.h, 8) + '</li>' +
        '<li>Número de pasos n = (x final − x₀)/h = (' + trimNum(K.xf, 6) + ' − ' + parN(K.x0, 6) + ') / ' + trimNum(K.h, 8) + ' = <b>' + K.n + '</b></li>' +
        '<li>Orden del método: <b>' + M.order + '</b> (error global ∝ h<sup>' + M.order + '</sup>)</li></ul></div></div>' +
      '<div class="panel"><div class="panel-head"><h3 class="sec">Paso 4 — Cálculo paso a paso</h3></div><div class="panel-body">' + stepLines(m, K, R) + '</div></div>' +
      '<div class="panel"><div class="panel-head"><h3 class="sec">Paso 5 — Tabla de iteraciones</h3></div><div class="panel-body">' + stepsTable(m, K, R) + '</div></div>' +
      '<div class="panel"><div class="panel-head"><h3 class="sec">Paso 6 — Resultado y error relativo</h3></div><div class="panel-body">' +
        answerBox(M.name + ": y(" + trimNum(K.xf, 6) + ")", "y(" + trimNum(K.xf, 6) + ") ≈ " + trimNum(yEnd, K.dec), exEnd, yEnd, '<div><dt>Pasos</dt><dd>' + K.n + '</dd></div>') +
        '<p class="tcap" style="margin-top:10px">Error medido contra ' + K.exactNote + '. Error relativo = |y verdadero − y aproximado| / |y verdadero| · 100.</p></div></div>' +
      plotPanel("Gráfica — solución verdadera y trayectoria del método", plotODE(K.x0, K.xf, series), series);
  } catch(e){ showErr(p, e); }
}
["euler", "heun", "rk3"].forEach(p => $(p + "Run").addEventListener("click", () => runMethod(p)));

/* ============================================================
   COMPARACIÓN
   ============================================================ */
function cmpRun(){
  $("cmpErr").textContent = "";
  try{
    const K = common("cmp");
    const hs = $("cmpHs").value.split(/[\s,;]+/).filter(Boolean).map(Number);
    if (!hs.length || hs.some(v => !isFinite(v) || v <= 0)) throw new Error("La lista de h debe tener números positivos separados por comas");
    const L = K.xf - K.x0;
    hs.forEach(hh => { const nr = L / hh; if (Math.abs(nr - Math.round(nr)) > 1e-9 * Math.max(1, nr)) throw new Error("h = " + hh + " no divide exactamente a x final − x₀ = " + trimNum(L, 8)); });
    const exEnd = K.ex(K.xf), keys = ["euler", "heun", "rk3", "rk4"];
    const res = {};
    keys.forEach(k => { res[k] = integrate(k, K.f, K.x0, K.y0, K.h, K.n); });
    keys.forEach(k => { if (!isFinite(res[k].y)) throw new Error("El método " + METHODS[k].name + " se salió del dominio de f"); });
    let rows = "";
    keys.forEach(k => {
      const y = res[k].y;
      rows += '<tr><td class="l">' + METHODS[k].name + '</td><td>' + METHODS[k].order + '</td><td>' + trimNum(y, K.dec) + '</td><td>' + trimNum(Math.abs(exEnd - y), 8) + '</td><td><b>' + pct(relErr(exEnd, y)) + '</b></td></tr>';
    });
    const colors = { euler: "var(--stop)", heun: "var(--accent)", rk3: "#2a8f6a", rk4: "var(--ink-3)" };
    const series = [{ name: "Solución verdadera", color: "var(--ink)", pts: curvaExacta(K, 120), w: 2.2 }];
    keys.forEach(k => series.push({ name: METHODS[k].name, color: colors[k], pts: [[K.x0, K.y0]].concat(res[k].rows.map(r => [r.xn, r.yNext])), w: 1.6, dash: k === "rk4" ? "5,3" : null, dots: k !== "rk4" }));
    // convergencia
    let conv = "";
    hs.forEach(hh => {
      const nn = Math.round(L / hh);
      let cells = '<td class="l">' + trimNum(hh, 8) + '</td><td>' + nn + '</td>';
      keys.forEach(k => { const Rr = integrate(k, K.f, K.x0, K.y0, hh, nn); const yy = Rr.y; cells += '<td>' + (isFinite(yy) ? pct(relErr(exEnd, yy)) : "—") + '</td>'; });
      conv += '<tr>' + cells + '</tr>';
    });
    $("cmpOut").innerHTML =
      '<div class="panel" style="margin-top:22px"><div class="panel-head"><h3 class="sec">Paso 3 — Resultados con h = ' + trimNum(K.h, 8) + ' (n = ' + K.n + ')</h3></div><div class="panel-body">' +
        '<div class="tablewrap"><table class="data"><thead><tr><th class="l">Método</th><th>Orden</th><th>y(' + trimNum(K.xf, 6) + ') aproximado</th><th>Error absoluto</th><th>Error relativo</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="tcap" style="margin-top:10px">Valor verdadero y(' + trimNum(K.xf, 6) + ') = ' + trimNum(exEnd, 8) + ' (' + K.exactNote + ').</p></div></div>' +
      plotPanel("Gráfica — todos los métodos frente a la solución verdadera", plotODE(K.x0, K.xf, series), series) +
      '<div class="panel"><div class="panel-head"><h3 class="sec">Paso 4 — Convergencia: error relativo al reducir h</h3></div><div class="panel-body">' +
        '<div class="tablewrap"><table class="data"><thead><tr><th class="l">h</th><th>n</th><th>Euler</th><th>Euler mejorado</th><th>RK3</th><th>RK4</th></tr></thead><tbody>' + conv + '</tbody></table></div>' +
        '<p class="tcap" style="margin-top:10px">Al dividir h entre 2 el error debería bajar ≈ ×2 (Euler), ×4 (Heun), ×8 (RK3) y ×16 (RK4), según el orden de cada método.</p></div></div>';
  } catch(e){ showErr("cmp", e); }
}
$("cmpRun").addEventListener("click", cmpRun);

const PY_HEAD = `import numpy as np

# ==========================================================
#  ZONA A MODIFICAR
# ==========================================================
def f(x, y):
    # (y^2 - x^2) dx + x y dy = 0   ->   y' = -M/N = (x^2 - y^2) / (x y)
    return (x ** 2 - y ** 2) / (x * y)

X0, Y0, XF, H = 1, 2, 1.2, 0.1

def exacta(x):                              # solucion exacta (para el error)
    return np.sqrt((x ** 4 + 7) / (2 * x ** 2))

# ==========================================================
#  DE AQUI PARA ABAJO NO SE TOCA NADA
# ==========================================================
`;
const PY_STEPS = {
  euler: `def paso(f, x, y, h):
    return y + h * f(x, y)
`,
  heun: `def paso(f, x, y, h):
    k1 = f(x, y)
    z = y + h * k1                          # predictor (Euler)
    k2 = f(x + h, z)
    return y + h / 2 * (k1 + k2)            # corrector: promedio de pendientes
`,
  rk3: `def paso(f, x, y, h):
    k1 = f(x, y)
    k2 = f(x + h / 2, y + h / 2 * k1)
    k3 = f(x + h, y - h * k1 + 2 * h * k2)
    return y + h / 6 * (k1 + 4 * k2 + k3)
`
};
const PY_RUN = `
def resolver(f, x0, y0, xf, h):
    n = round((xf - x0) / h)
    x, y = x0, y0
    tabla = []
    for j in range(n):
        y = paso(f, x, y, h)
        x = x0 + (j + 1) * h
        tabla.append((x, y))
    return tabla

print(f"{'x':>8} {'y aprox':>14} {'y verdadero':>14} {'Error rel %':>12}")
for x, y in resolver(f, X0, Y0, XF, H):
    ye = exacta(x)
    print(f"{x:>8.4f} {y:>14.8f} {ye:>14.8f} {abs(ye - y) / abs(ye) * 100:>12.6f}")`;
const PY_CMP = PY_HEAD + `def euler(f, x, y, h):
    return y + h * f(x, y)

def heun(f, x, y, h):
    k1 = f(x, y)
    return y + h / 2 * (k1 + f(x + h, y + h * k1))

def rk3(f, x, y, h):
    k1 = f(x, y)
    k2 = f(x + h / 2, y + h / 2 * k1)
    k3 = f(x + h, y - h * k1 + 2 * h * k2)
    return y + h / 6 * (k1 + 4 * k2 + k3)

def rk4(f, x, y, h):
    k1 = f(x, y)
    k2 = f(x + h / 2, y + h / 2 * k1)
    k3 = f(x + h / 2, y + h / 2 * k2)
    k4 = f(x + h, y + h * k3)
    return y + h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)

def resolver(paso, f, x0, y0, xf, h):
    n = round((xf - x0) / h)
    y = y0
    for j in range(n):
        y = paso(f, x0 + j * h, y, h)
    return y

yv = exacta(XF)
print(f"y({XF}) verdadero = {yv:.8f}\\n")
print(f"{'Metodo':>10} {'y aprox':>14} {'Error abs':>12} {'Error rel %':>12}")
for nombre, m in [("Euler", euler), ("Heun", heun), ("RK3", rk3), ("RK4", rk4)]:
    y = resolver(m, f, X0, Y0, XF, H)
    print(f"{nombre:>10} {y:>14.8f} {abs(yv - y):>12.8f} {abs(yv - y) / abs(yv) * 100:>12.6f}")`;

function syncTheme(){ themeLbl.textContent = currentDark() ? "Cambiar a claro" : "Cambiar a oscuro"; }
$("themeBtn").addEventListener("click", () => {
  root.setAttribute("data-theme", currentDark() ? "light" : "dark");
  syncTheme();
});
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme); }catch(e){}
syncTheme();

</script>
</body>
</html>
